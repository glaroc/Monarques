name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Required by the Pages deploy action's OIDC token exchange.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # Pages serves this at https://<owner>.github.io/<repo>/, so the bundle
      # needs that prefix as its base. Title/meta come from app/.env.production
      # (the local .env is gitignored and absent in CI).
      - name: Build
        run: npx vite build --base=/${{ github.event.repository.name }}/

      # Pages has no SPA rewrite; serving index.html as 404.html keeps deep
      # links inside the app instead of GitHub's error page.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
